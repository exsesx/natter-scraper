name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
          - platform: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: browser-actions/setup-chrome@v2.2.0
        id: chrome
        with:
          # Windows arm64 needs snapshots. On macOS, the version installer
          # preserves the .app bundle that the channel installer strips.
          chrome-version: ${{ matrix.platform == 'windows-arm64' && 'latest' || startsWith(matrix.platform, 'darwin-') && '153.0.8010.52' || 'stable' }}
          install-dependencies: true
      - name: Configure Chrome sandbox on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # Ubuntu restricts user namespaces for downloaded Chrome binaries.
          # Record the original startup result, then allow only this executable.
          timeout 15s "$BUN_CHROME_PATH" --headless --disable-gpu --dump-dom about:blank || true
          chrome_executable=$(readlink -f "$BUN_CHROME_PATH")
          sudo tee /etc/apparmor.d/natter-ci-chrome > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile natter-ci-chrome "$chrome_executable" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser --replace /etc/apparmor.d/natter-ci-chrome
          timeout 15s "$BUN_CHROME_PATH" --headless --disable-gpu --dump-dom about:blank
      - name: Configure Chrome sandbox on Windows
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # Chrome for Testing ships the installer that grants its sandbox access.
          $chromeDirectory = Split-Path -Parent $env:BUN_CHROME_PATH
          $chromeSetup = Join-Path $chromeDirectory 'setup.exe'
          $setupResult = Start-Process -FilePath $chromeSetup -ArgumentList "--configure-browser-in-directory=`"$chromeDirectory`"" -Wait -PassThru
          # Upstream notes that setup can return nonzero after applying permissions.
          # Keep that diagnostic; the following startup and fixture checks must pass.
          Write-Host "Chrome sandbox setup exit code: $($setupResult.ExitCode)"
      - name: Verify WebView startup
        env:
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: >-
          bun --eval 'const view = new Bun.WebView({backend:{type:"chrome",url:false,stderr:"inherit"},dataStore:"ephemeral"});
          const timeout = setTimeout(() => { console.error("WebView startup exceeded 30 seconds"); view.close(); process.exit(1); }, 30000);
          try { console.time("WebView startup"); await view.navigate("about:blank"); console.log(await view.evaluate("navigator.userAgent")); console.timeEnd("WebView startup"); }
          finally { clearTimeout(timeout); view.close(); }'
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: bun run test:terminal
        env:
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: bun run test:binary
        env:
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: bun run build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: natter-scraper-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
